name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that's still going, except on main, where it waits so a
# deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Where the server runs. Same Swift version as development so far.
  linux:
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # GRDB needs SQLite's headers, which the Swift image doesn't include.
      - run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
      - run: swift --version
      - run: swift test

  # Where the CLI and development run. Uses the image's default Xcode.
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift test

  # The Docker image: builds, starts, and answers. Same steps as `just docker-build`, `docker-run` and
  # `docker-token`.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t whatfeature .
      - name: Start it with the example flags
        run: |
          docker run -d --name whatfeature -p 8080:8080 \
            -v whatfeature-data:/data \
            -v "$PWD/examples:/seed:ro" -e SEED_FILE=/seed/seed.json \
            whatfeature
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 1
          done
          echo "The server didn't answer /health in 30 seconds."
          exit 1
      - name: Admin token, admin API and OFREP
        run: |
          token=$(docker exec whatfeature whatfeature db token create --admin --name ci | grep -o 'wf_admin_[A-Za-z0-9]*')
          curl -fsS -H "Authorization: Bearer $token" http://localhost:8080/admin/v1/me
          echo
          curl -fsS -X POST http://localhost:8080/ofrep/v1/evaluate/flags \
            -H "Authorization: Bearer wf_eval_dev_local_only" -H "Content-Type: application/json" \
            -d '{"context": {"targetingKey": "june", "country": "US"}}' | tee response.json
          echo
          grep -q '"key":"new-onboarding"' response.json
      - name: Container logs
        if: always()
        run: docker logs whatfeature || true

  # Every push to main that passes the jobs above goes to Fly. Same as `just fly-deploy`, but the image is built
  # here rather than on Fly's remote builder. Needs the FLY_API_TOKEN secret (`fly tokens create deploy`).
  deploy:
    needs: [linux, macos, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --ha=false --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
